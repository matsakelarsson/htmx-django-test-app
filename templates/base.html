{% load static tailwind_cli %}<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Let htmx swap 422 responses so validation errors can be shown in place. #}
  <meta name="htmx-config" content='{"responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "422", "swap": true}, {"code": "[45]..", "swap": false, "error": true}]}'>
  <title>{% block title %}HTMX + Django{% endblock %}</title>
  {% tailwind_css %}
  {# htmx comes from the copy bundled with django-htmx, so no CDN is involved. #}
  <script src="{% static 'django_htmx/htmx-2.min.js' %}" defer></script>
</head>
<body class="min-h-full bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <main class="mx-auto max-w-5xl px-4 py-12">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
